# Q6 レビュー D2 / D3。
#
# **SDK を1か所で宣言する。** `@Config(sdk = [34])` を各テストクラスに書くと、
# クラスが増えたときに片方だけ古い値のまま残る —— このプロジェクトが繰り返した
# 「2か所に書いた文言の片方だけが嘘をつく」形そのもの(Q5 レビュー minor-2)。
#
# なぜ 34 か: Robolectric 4.14.1 が android-all を用意しているのは SDK 35 までで、
# このプロジェクトの `compileSdk = 36` に対応するものは存在しない。
# `targetSdk = 35` に近く、4.14.1 が安定して提供している 34 を採る。
# **アプリのツールチェーンは動かしていない**(AGENTS.md): minSdk 26 / targetSdk 35 /
# compileSdk 36 はいずれも変更なし。ここで決まるのは**テストの実行環境**だけである。
#
# ## 既知の制約(閉じていない。報告に「次期計画」として記載)
#
# Robolectric は `android-all-instrumented` を**テスト実行時に自前の Maven リゾルバで取得する**。
# Gradle の依存解決・検証を迂回するため:
#   - cold machine / CI の初回は**ネットワークが要る**
#   - 取得物は Gradle の dependency verification の対象外
# オフライン再現性を要求するなら `robolectric.offline=true` +
# `robolectric.dependency.dir=<vendored jars>` で jar を同梱する必要がある。
sdk=34
