name: E2E (emulator + stub server)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-smoke:
    name: Smoke on API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [34]
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Start stub opencode server
        run: |
          STUB_PORT=4098 STUB_PASSWORD=stub-pass nohup node e2e-stub/server.mjs > stub.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS -u opencode:stub-pass http://127.0.0.1:4098/global/health; then echo; break; fi
            sleep 1
          done

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 scripts/e2e_smoke.py --apk app/build/outputs/apk/debug/app-debug.apk --out e2e-artifacts/ci

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-api${{ matrix.api-level }}
          path: |
            e2e-artifacts/ci
            stub.log
          if-no-files-found: ignore
